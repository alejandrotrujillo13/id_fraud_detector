[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "id_fraud_detector"
version = "0.1.0"
description = "Fraud risk indicator for photos of Colombian ID cards (graduate project)"
requires-python = ">=3.11"
# Base: what the data pipeline, the rule engine and the crop need.
dependencies = [
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Local review app (scripts/13_visual_review.py).
review = ["streamlit>=1.35"]
# Phase 3: the image classifier. Install PyTorch FIRST from its own index so it comes with GPU
# support (the default index only has the CPU build for Windows):
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu126
#   pip install -e ".[review,train]"
train = ["torch>=2.6", "torchvision>=0.21", "matplotlib>=3.8"]
# The `serve` group is added when phase 6 starts.

[tool.setuptools.packages.find]
where = ["src"]
