[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "id_fraud_detector"
version = "0.1.0"
description = "Fraud risk indicator for photos of Colombian ID cards (graduate project)"
requires-python = ">=3.11"
# Base: what the data pipeline, the rule engine and the crop need.
dependencies = [
    "psycopg2-binary>=2.9",
    "boto3>=1.34",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Local review app (scripts/13_visual_review.py).
review = ["streamlit>=1.35"]
# The `train` and `serve` groups are added when phases 3 and 6 start.

[tool.setuptools.packages.find]
where = ["src"]
